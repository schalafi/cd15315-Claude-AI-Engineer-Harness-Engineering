# Installed automatically in the dev container (.devcontainer/post-create.sh).
# Elsewhere: pip install pre-commit && pre-commit install
repos:
  - repo: https://github.com/kynan/nbstripout
    rev: 0.9.1
    hooks:
      - id: nbstripout
        args: ["--extra-keys", "metadata.kernelspec metadata.language_info.version"]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: detect-private-key
      - id: check-added-large-files
        args: ["--maxkb=1000"]

  - repo: local
    hooks:
      - id: no-env-files
        name: Block committing .env files
        language: fail
        entry: ".env files hold credentials and must not be committed (use .env.example)"
        files: '(^|/)\.env(\..+)?$'
        exclude: '(^|/)\.env\.example$'
      - id: no-anthropic-keys
        name: Block Anthropic API keys
        language: pygrep
        entry: 'sk-ant-[A-Za-z0-9_-]{20,}'
